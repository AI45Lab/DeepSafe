# Qwen LoRA initial -> a different API model for evidence review -> deterministic gate.
# Explicit current single-stage settings. Credentials: LLM_REVIEW_API_KEY.
# Set QWEN_BASE_PATH (and QWEN_LORA_PATH on Linux); limit=0 runs all pending samples.
module_profile: value
model:
  type: ValueQAClassificationModel
dataset:
  type: ValueQAClassificationDataset
  labels_from_references: true
  path: data/valueqa/evaluation_samples.jsonl
  references_path: data/valueqa/reference_annotations.jsonl
evaluator:
  type: ValueQAClassificationEvaluator
  config_path: ValueQA_Classification/config.current.local.json
  runtime:
    review_backend: api
    review_api_base: https://api.deepseek.com
    review_api_model: deepseek-flash
    review_api_workers: 5
    review_api_timeout: 120
    review_max_new_tokens: 4096
    review_confidence_thresholds: {high: 0.9, medium: 0.9, low: 0.7}
    quantization: 4bit
    local_files_only: true
    mode: experimental
    review_max_input_tokens: 6144
  state_dir: results/valueqa_classification_current_api/state
  limit: 0
  policy_path: ''
  initial_predictions: ''
  imported_only: false
  dry_run: false
  use_precomputed_predictions: false
metrics:
- type: ValueQAClassificationMetric
summarizer:
  type: StandardSummarizer
runner:
  type: LocalRunner
  stage: all
  prediction_policy: strict
  output_dir: results/valueqa_classification_current_api
  use_evaluator_gen: true
  badcase_unknown_samples: 0
